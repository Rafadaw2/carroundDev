<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caround</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
<link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Navbar superior -->
  <nav class="navbar navbar-light bg-white shadow-sm px-3">
    <div class="container-fluid">
      <!-- Botón hamburguesa visible solo en móviles -->
      <button class="btn d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu"
        aria-controls="mobileMenu">
        <i class="bi bi-list fs-3"></i>
      </button>

      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="./img/LOGO2.png" alt="Caround Logo" class="logo ms-2" />
      </a>

      <!-- Icono de sesión -->
      <div class="dropdown ms-auto">
        <i class="bi bi-person-circle session-icon dropdown-toggle" id="sessionDropdown" data-bs-toggle="dropdown"
          aria-expanded="false"></i>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="sessionDropdown">
          <li><a class="dropdown-item" href="#">Iniciar sesión</a></li>
          <li><a class="dropdown-item" href="#">Registrarse</a></li>
          <li>
            <hr class="dropdown-divider" />
          </li>
          <li><a class="dropdown-item" href="#">Cerrar sesión</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Cuerpo principal -->
  <div class="container-fluid flex-grow-1 d-flex p-0">
    <!-- Menú lateral (solo en escritorio) -->
    <div class="col-2 sidebar d-none d-md-block">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link active" href="#">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Vehículos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Perfil</a>
        </li>
      </ul>
    </div>

    <!-- Menú móvil con offcanvas -->
    <div class="offcanvas offcanvas-start d-md-none" tabindex="-1" id="mobileMenu" aria-labelledby="mobileMenuLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="mobileMenuLabel">Menú</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body">
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" href="#">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Vehículos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Perfil</a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Contenido -->
    <div class="col main-content">
      <h1>Bienvenido a Caround</h1>
      <p>Aquí va el contenido de la página principal.</p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-auto">
    <p class="mb-0">&copy; 2025 Caround. Todos los derechos reservados.</p>
    <div>
      <a href="#" class="text-white me-3">Facebook</a>
      <a href="#" class="text-white me-3">Twitter</a>
      <a href="#" class="text-white">Instagram</a>
    </div>
  </footer>

  <!-- Bootstrap Bundle JS (sin integrity para evitar bloqueo) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>

</html>
